name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: bun install
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: bunx eslint fixtures --max-warnings 0
      - run: python3 scripts/test_review_lenses.py
      - run: python3 scripts/test_review_check.py
