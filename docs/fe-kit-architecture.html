<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fe-kit — Kiến trúc tổng thể</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · fe-kit v1.22</p>
    <h1>Một plugin, ba host, hai câu hỏi trước mỗi lần ghi</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fekit-arch-title fekit-arch-desc">
        <title id="fekit-arch-title">Kiến trúc tổng thể fe-kit</title>
        <desc id="fekit-arch-desc">Ba host Claude Code, Devin và omp chạy cùng một gate engine: hook và extension đánh chặn tool call, gate kiểm nhãn ownership trước khi cho ghi code, còn nội dung skill và pipeline review dẫn hướng agent.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== Zone: host surface (x40-260, y36-268) ===== -->
        <rect x="40" y="36" width="220" height="232" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="96" y="40" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="150" y="49" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">HOST SURFACE</text>

        <!-- ===== Arrows (before nodes) ===== -->

        <!-- host fan-in → agent context left edge ports y102/114/126 -->
        <line x1="240" y1="102" x2="340" y2="102" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 240,166 H 276 Q 284,166 284,158 V 122 Q 284,114 292,114 H 340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 240,230 H 292 Q 300,230 300,222 V 134 Q 300,126 308,126 H 340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- injection: skill content → agent context left edge port y138 (dashed, passive) -->
        <path d="M 320,500 V 146 Q 320,138 328,138 H 340" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="232" y="316" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="270" y="325" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INJECT RULES</text>

        <!-- tool calls: agent context → gate engine -->
        <line x1="540" y1="120" x2="700" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="586" y="100" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="109" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOOL CALLS</text>

        <!-- write policy: gate engine → target repo (accent, the enforcement headline) -->
        <line x1="900" y1="120" x2="1000" y2="120" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="916" y="100" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="950" y="109" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE POLICY</text>

        <!-- reads: state → gate engine bottom edge -->
        <line x1="800" y1="500" x2="800" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="808" y="332" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="830" y="341" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>

        <!-- handoff artifacts: agent context → state -->
        <path d="M 460,148 V 512 Q 460,520 468,520 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="470" y="268" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="496" y="277" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HANDOFF</text>

        <!-- diff: target repo → review pipeline -->
        <line x1="1100" y1="148" x2="1100" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="1108" y="324" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1122" y="333" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DIFF</text>

        <!-- review invoke: agent context → review pipeline bottom edge (dashed, on request) -->
        <path d="M 360,148 V 592 H 952 Q 960,592 960,584 V 556" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="620" y="574" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="652" y="583" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ON REQUEST</text>

        <!-- ===== Nodes ===== -->

        <!-- host: Claude Code -->
        <rect x="56" y="74" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="74" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="64" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="80" y="89" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOKS</text>
        <text x="148" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Claude Code</text>
        <text x="148" y="122" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">hooks/hooks.json</text>

        <!-- host: Devin -->
        <rect x="56" y="138" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="138" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="64" y="144" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="80" y="153" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOKS</text>
        <text x="148" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Devin CLI</text>
        <text x="148" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">devin-gate.sh</text>

        <!-- host: omp -->
        <rect x="56" y="202" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="202" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="64" y="208" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="74" y="217" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="148" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">omp</text>
        <text x="148" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">extensions/fe-gate.ts</text>

        <!-- agent context -->
        <rect x="340" y="92" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="92" width="200" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="348" y="98" width="36" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="366" y="107" fill="rgba(90,101,128,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="440" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Agent context</text>
        <text x="440" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">prompt + rules đã inject</text>

        <!-- gate engine — focal -->
        <rect x="700" y="92" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="92" width="200" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="708" y="98" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="722" y="107" fill="rgba(191,69,32,0.85)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
        <text x="800" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Gate engine</text>
        <text x="800" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fe-gate.py · devin_gate.py</text>

        <!-- target repo -->
        <rect x="1000" y="92" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="1000" y="92" width="200" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="1008" y="98" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="1023" y="107" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
        <text x="1100" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Target repo</text>
        <text x="1100" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">code được phép ghi</text>

        <!-- skill content -->
        <rect x="120" y="500" width="260" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="500" width="260" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="128" y="506" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="150" y="515" fill="rgba(79,93,117,0.85)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CONTENT</text>
        <text x="250" y="534" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Skill content</text>
        <text x="250" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">skills/fe-kit · rules/ · playbooks/</text>

        <!-- .fe-kit state -->
        <rect x="680" y="500" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="500" width="240" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="688" y="506" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="704" y="515" fill="rgba(79,93,117,0.85)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="800" y="534" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">.fe-kit state</text>
        <text x="800" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">config.yaml · reviews · handoff</text>

        <!-- review pipeline — focal -->
        <rect x="940" y="500" width="280" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="940" y="500" width="280" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="948" y="506" width="52" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="974" y="515" fill="rgba(191,69,32,0.85)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PIPELINE</text>
        <text x="1080" y="534" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Review pipeline</text>
        <text x="1080" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">review_lenses · packages · check</text>

        <!-- ===== Legend ===== -->
        <line x1="30" y1="652" x2="1250" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="120" y1="664" x2="152" y2="664" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="160" y="667" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">quyết định ghi (enforce)</text>
        <line x1="368" y1="664" x2="400" y2="664" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="408" y="667" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">thụ động / theo yêu cầu</text>
        <line x1="600" y1="664" x2="632" y2="664" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="640" y="667" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">luồng dữ liệu</text>
      </svg>
    </div>
  </div>
</body>
</html>
