<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fe-kit — Luồng gate</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · fe-kit v1.22</p>
    <h1>Luồng gate: một lần ghi và một lần commit</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fekit-gate-title fekit-gate-desc">
        <title id="fekit-gate-title">Luồng gate của fe-kit</title>
        <desc id="fekit-gate-desc">PreToolUse kiểm mọi lần ghi file code trong scope: sửa chữ thuần tuý hoặc ngoài scope vẫn ghi nhưng miễn nhãn, còn lại phải có nhãn runtime owner và decision; thiếu nhãn bị từ chối, commit bị chặn đến khi user approve handoff.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== Arrows (drawn first, behind nodes) ===== -->

        <!-- main chain -->
        <line x1="280" y1="62" x2="280" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="116" x2="280" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="180" x2="280" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="244" x2="280" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="302" x2="280" y2="326" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="368" x2="280" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="700" y1="455" x2="700" y2="503" stroke="none"/>
        <line x1="280" y1="432" x2="280" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- exempt trunk: D1 không (ngoài scope) → xuống trái, vào Ghi file -->
        <path d="M 232,94 H 192 Q 184,94 184,102 V 266 Q 184,274 192,274 H 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- D2 có (sửa chữ thuần) → nhập vào exempt trunk -->
        <line x1="232" y1="158" x2="188" y2="158" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- D3 không (thiếu nhãn) → từ chối -->
        <line x1="328" y1="222" x2="680" y2="222" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- deny loop: echo nhãn rồi thử lại -->
        <path d="M 800,217 H 872 Q 880,217 880,209 V 52 Q 880,44 872,44 H 370" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- D4 không (chưa approve) → sửa handoff, thử lại -->
        <path d="M 328,410 H 472 Q 480,410 480,402 V 355 Q 480,347 472,347 H 370" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- ===== Arrow labels ===== -->

        <!-- chain answers, beside vertical connectors -->
        <rect x="288" y="120" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="300" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

        <rect x="288" y="184" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="316" y="193" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

        <rect x="288" y="248" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="300" y="257" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

        <rect x="288" y="306" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="326" y="315" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TRƯỚC COMMIT</text>

        <rect x="288" y="436" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="300" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

        <!-- branch labels, above horizontal lanes -->
        <rect x="140" y="76" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="168" y="85" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

        <rect x="120" y="140" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="132" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

        <rect x="364" y="204" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="392" y="213" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

        <rect x="364" y="392" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="392" y="401" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

        <!-- loop labels -->
        <rect x="520" y="26" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="576" y="35" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">echo nhãn, thử lại</text>

        <rect x="488" y="340" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="546" y="349" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">sửa handoff, thử lại</text>

        <!-- ===== Nodes ===== -->

        <!-- start oval -->
        <rect x="190" y="20" width="180" height="42" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="280" y="40" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Agent ghi file</text>
        <text x="280" y="54" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PreToolUse</text>

        <!-- D1: scope -->
        <polygon points="280,72 328,94 280,116 232,94" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="91" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">file code</text>
        <text x="280" y="104" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">trong scope?</text>

        <!-- D2: wording — focal decision -->
        <polygon points="280,136 328,158 280,180 232,158" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="280" y="155" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">sửa chữ thuần?</text>
        <text x="280" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">wording.py diff</text>

        <!-- D3: nhãn -->
        <polygon points="280,200 328,222 280,244 232,222" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="219" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">đủ nhãn?</text>
        <text x="280" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">owner · decision</text>

        <!-- merge dot on exempt trunk -->
        <circle cx="184" cy="158" r="4" fill="#2d3142"/>

        <!-- X1: write + post check -->
        <rect x="200" y="264" width="160" height="38" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ghi file</text>
        <text x="280" y="295" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PostToolUse kiểm lại</text>

        <!-- A1: handoff -->
        <rect x="190" y="326" width="180" height="42" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="345" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Viết handoff + hỏi đáp</text>
        <text x="280" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">.fe-kit/handoff.md</text>

        <!-- D4: approve -->
        <polygon points="280,388 328,410 280,432 232,410" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="407" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">user</text>
        <text x="280" y="420" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">approve?</text>

        <!-- end oval -->
        <rect x="190" y="452" width="180" height="30" rx="15" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="280" y="471" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Commit thành công</text>

        <!-- terminal: từ chối -->
        <rect x="680" y="200" width="120" height="34" rx="17" fill="rgba(45,49,66,0.03)" stroke="#bf4520" stroke-width="1"/>
        <text x="740" y="221" fill="#bf4520" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Từ chối</text>

        <!-- ===== Legend ===== -->
        <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="112" y="524" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="144" y="534" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">đầu / cuối</text>

        <rect x="252" y="524" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="284" y="534" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">bước</text>

        <polygon points="388,530 400,524 412,530 400,536" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="420" y="534" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">quyết định</text>

        <line x1="524" y1="530" x2="552" y2="530" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="560" y="534" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">vòng thử lại</text>

        <line x1="700" y1="530" x2="728" y2="530" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="736" y="534" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">bị chặn</text>

      </svg>
    </div>
  </div>
</body>
</html>
